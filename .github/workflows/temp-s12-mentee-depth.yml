name: TEMP S12 Mentee Application Depth

on:
  push:
    branches:
      - s12-mentee-application-depth

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply bounded mentee-form patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly 1 match, found {count}\n--- expected ---\n{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          form = "app/apply/mentee/apply-mentee-form.tsx"
          action = "app/actions/apply.ts"

          replace_once(form, '''        <TextAreaField
            name="current_difficulty_text"
            label="Khó khăn cụ thể bạn đang cần mentor hỗ trợ"
            rows={3}
          />''', '''        <TextAreaField
            name="current_difficulty_text"
            label="Khó khăn cụ thể bạn đang cần mentor hỗ trợ"
            required
            minLength={100}
            rows={4}
            helpText="Tối thiểu ~100 ký tự. Nêu tình huống cụ thể, điều bạn đã thử và điều bạn mong Mentor hỗ trợ."
          />''')

          replace_once(form, '''        <TextAreaField
          name="why_uem_text"
          label="Vì sao bạn chọn UEH Mentoring?"
          rows={4}
        />''', '''        <TextAreaField
          name="why_uem_text"
          label="Vì sao bạn chọn UEH Mentoring?"
          required
          minLength={100}
          rows={4}
          helpText="Tối thiểu ~100 ký tự. Chia sẻ điều bạn thực sự kỳ vọng ở hành trình mentoring này."
        />''')

          replace_once(form, '''        <TextAreaField
          name="mentoring_plan_text"
          label="Kế hoạch của bạn để tận dụng mentoring"
          rows={3}
        />''', '''        <TextAreaField
          name="mentoring_plan_text"
          label="Kế hoạch của bạn để tận dụng mentoring"
          required
          minLength={100}
          rows={4}
          helpText="Tối thiểu ~100 ký tự. Nêu cách bạn sẽ chuẩn bị, hành động và theo dõi tiến bộ giữa các buổi mentoring."
        />''')

          replace_once(form, '''        <TextAreaField
          name="if_not_effective_text"
          label="Nếu mentoring không hiệu quả như mong đợi, bạn sẽ làm gì?"
          rows={3}
        />''', '''        <TextAreaField
          name="if_not_effective_text"
          label="Nếu mentoring không hiệu quả như mong đợi, bạn sẽ làm gì?"
          required
          minLength={100}
          rows={4}
          helpText="Tối thiểu ~100 ký tự. Hãy mô tả cách bạn sẽ chủ động xử lý trước khi nghĩ đến việc dừng mentoring."
        />''')

          replace_once(form, '''        <ConsentCheckbox
          name="commitment_understanding"''', '''        <TextField
          name="profile_or_cv_url"
          label="CV / LinkedIn / portfolio / profile (không bắt buộc)"
          type="url"
          placeholder="https://..."
          helpText="Không bắt buộc — khuyến khích nếu bạn muốn BTC và Mentor hiểu thêm về trải nghiệm, hoạt động hoặc dự án của bạn."
        />
        <ConsentCheckbox
          name="commitment_understanding"''')

          replace_once(action, '''      if_not_effective_text: formText(formData, "if_not_effective_text") || null,
      commitment_understanding: formBoolean(formData, "commitment_understanding"),''', '''      if_not_effective_text: formText(formData, "if_not_effective_text") || null,
      profile_or_cv_url: formText(formData, "profile_or_cv_url") || null,
      commitment_understanding: formBoolean(formData, "commitment_understanding"),''')

          replace_once(action, '''      top_3_questions_for_mentor: rawPayload.top_3_questions_for_mentor,
      available_for_kickoff: rawPayload.available_for_kickoff''', '''      top_3_questions_for_mentor: rawPayload.top_3_questions_for_mentor,
      current_difficulty_text: rawPayload.current_difficulty_text,
      why_uem_text: rawPayload.why_uem_text,
      mentoring_plan_text: rawPayload.mentoring_plan_text,
      if_not_effective_text: rawPayload.if_not_effective_text,
      available_for_kickoff: rawPayload.available_for_kickoff''')

          replace_once(action, '''    const interviewOk = (rawPayload.available_for_interview as string[]).length > 0;
    const emailNotifOk = (rawPayload.email_notification_consent as string[]).length > 0;''', '''    const narrativeRequirements = [
      { key: "one_year_vision_text", label: "Phiên bản tốt nhất của bạn sau 1 năm", minLength: 100 },
      { key: "mentoring_goals_text", label: "Mục tiêu cụ thể qua mentoring", minLength: 100 },
      { key: "top_3_questions_for_mentor", label: "3 câu hỏi cụ thể bạn muốn hỏi Mentor", minLength: 50 },
      { key: "current_difficulty_text", label: "Khó khăn cụ thể bạn đang cần Mentor hỗ trợ", minLength: 100 },
      { key: "why_uem_text", label: "Vì sao bạn chọn UEH Mentoring?", minLength: 100 },
      { key: "mentoring_plan_text", label: "Kế hoạch của bạn để tận dụng mentoring", minLength: 100 },
      { key: "if_not_effective_text", label: "Nếu mentoring không hiệu quả như mong đợi, bạn sẽ làm gì?", minLength: 100 }
    ] as const;
    const interviewOk = (rawPayload.available_for_interview as string[]).length > 0;
    const emailNotifOk = (rawPayload.email_notification_consent as string[]).length > 0;''')

          replace_once(action, '''    if (!interviewOk) {
      return { ok: false, message: "Vui lòng chọn ít nhất một khoảng thời gian sẵn sàng phỏng vấn." };
    }''', '''    const tooShortNarrative = narrativeRequirements.find(({ key, minLength }) =>
      String(rawPayload[key] ?? "").trim().length < minLength
    );
    if (tooShortNarrative) {
      return {
        ok: false,
        message: `${tooShortNarrative.label} cần tối thiểu ${tooShortNarrative.minLength} ký tự.`,
        fieldErrors: [{ name: tooShortNarrative.key, label: tooShortNarrative.label }]
      };
    }
    if (!interviewOk) {
      return { ok: false, message: "Vui lòng chọn ít nhất một khoảng thời gian sẵn sàng phỏng vấn." };
    }''')

          test = Path("__tests__/s12-mentee-application-depth.test.ts")
          test.write_text(r'''import { readFileSync } from "node:fs";
import { describe, expect, it } from "vitest";

const FORM = readFileSync("app/apply/mentee/apply-mentee-form.tsx", "utf8");
const ACTION = readFileSync("app/actions/apply.ts", "utf8");

function fieldBlock(source: string, name: string, radius = 450) {
  const marker = `name="${name}"`;
  const index = source.indexOf(marker);
  expect(index, `${name} must exist`).toBeGreaterThan(-1);
  return source.slice(Math.max(0, index - 120), index + radius);
}

describe("S12 mentee application depth contract", () => {
  const requiredNarratives = [
    "current_difficulty_text",
    "why_uem_text",
    "mentoring_plan_text",
    "if_not_effective_text"
  ];

  it.each(requiredNarratives)("makes %s required with a 100-character browser floor", (name) => {
    const block = fieldBlock(FORM, name);
    expect(block).toContain("required");
    expect(block).toContain("minLength={100}");
  });

  it("keeps all seven selection narratives server-enforced at their UI minimums", () => {
    for (const name of [
      "one_year_vision_text",
      "mentoring_goals_text",
      "top_3_questions_for_mentor",
      ...requiredNarratives
    ]) {
      expect(ACTION).toContain(`{ key: "${name}"`);
    }
    expect(ACTION).toContain('minLength: 50');
    expect(ACTION.match(/minLength: 100/g)?.length).toBeGreaterThanOrEqual(6);
    expect(ACTION).toContain("tooShortNarrative");
    expect(ACTION).toContain("fieldErrors: [{ name: tooShortNarrative.key, label: tooShortNarrative.label }]");
  });

  it.each(requiredNarratives)("includes %s in authoritative required-field validation", (name) => {
    expect(ACTION).toContain(`${name}: rawPayload.${name}`);
  });

  it("adds an optional profile/CV URL and persists it only in raw_payload", () => {
    const block = fieldBlock(FORM, "profile_or_cv_url");
    expect(block).toContain('type="url"');
    expect(block).not.toMatch(/\brequired\b/);
    expect(ACTION).toContain('profile_or_cv_url: formText(formData, "profile_or_cv_url") || null');
    expect(ACTION.match(/profile_or_cv_url/g)?.length).toBe(2);
  });
});
''', encoding="utf-8")
          PY

      - name: Focused tests
        run: npm test -- __tests__/s12-mentee-application-depth.test.ts __tests__/uat-s12-server-validation.test.ts __tests__/application-form-ux.test.tsx

      - name: Full unit suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Diff sanity
        run: |
          git diff --check
          git status --short
          test -n "$(git status --short)"

      - name: Commit clean production candidate
        shell: bash
        run: |
          git config user.name "VAM OS Automation"
          git config user.email "automation@users.noreply.github.com"
          git add app/apply/mentee/apply-mentee-form.tsx app/actions/apply.ts __tests__/s12-mentee-application-depth.test.ts
          git rm .github/workflows/temp-s12-mentee-depth.yml
          git commit -m "Improve S12 mentee application depth"
          git push origin HEAD:s12-mentee-application-depth
