name: TEMP S12 Mentee Application Depth

on:
  push:
    branches: [s12-mentee-application-depth]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply bounded patch
        run: python scripts/temp_s12_mentee_depth_patch_v2.py

      - name: Tighten generated profile-field test boundary
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path("__tests__/s12-mentee-application-depth.test.ts")
          text = p.read_text(encoding="utf-8")
          old = '    const block = fieldBlock(FORM, "profile_or_cv_url");\n'
          new = '''    const marker = 'name="profile_or_cv_url"';
    const markerIndex = FORM.indexOf(marker);
    const fieldStart = FORM.lastIndexOf("<TextField", markerIndex);
    const fieldEnd = FORM.indexOf("/>", markerIndex);
    const block = FORM.slice(fieldStart, fieldEnd + 2);
'''
          if text.count(old) != 1:
              raise SystemExit("profile test boundary anchor drifted")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Focused tests
        run: npm test -- __tests__/s12-mentee-application-depth.test.ts __tests__/uat-s12-server-validation.test.ts __tests__/application-form-ux.test.tsx

      - name: Full unit suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Diff sanity
        run: git diff --check

      - name: Commit candidate and remove temporary worker
        run: |
          git config user.name "VAM OS Automation"
          git config user.email "automation@users.noreply.github.com"
          git add app/apply/mentee/apply-mentee-form.tsx app/actions/apply.ts __tests__/s12-mentee-application-depth.test.ts
          git rm .github/workflows/temp-s12-mentee-depth.yml scripts/temp_s12_mentee_depth_patch.py scripts/temp_s12_mentee_depth_patch_v2.py
          git commit -m "Improve S12 mentee application depth"
          git push origin HEAD:s12-mentee-application-depth
