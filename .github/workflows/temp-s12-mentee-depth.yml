name: TEMP S12 Mentee Application Depth

on:
  push:
    branches: [s12-mentee-application-depth]

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Apply bounded patch
        run: python scripts/temp_s12_mentee_depth_patch.py

      - name: Focused tests
        run: npm test -- __tests__/s12-mentee-application-depth.test.ts __tests__/uat-s12-server-validation.test.ts __tests__/application-form-ux.test.tsx

      - name: Full unit suite
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Diff sanity
        run: git diff --check

      - name: Commit candidate and remove temporary worker
        run: |
          git config user.name "VAM OS Automation"
          git config user.email "automation@users.noreply.github.com"
          git add app/apply/mentee/apply-mentee-form.tsx app/actions/apply.ts __tests__/s12-mentee-application-depth.test.ts
          git rm .github/workflows/temp-s12-mentee-depth.yml scripts/temp_s12_mentee_depth_patch.py
          git commit -m "Improve S12 mentee application depth"
          git push origin HEAD:s12-mentee-application-depth
